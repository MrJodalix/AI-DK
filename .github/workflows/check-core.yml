name: check-core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run AI-DK check_core
        run: python3 .ai/tests/check_core.py
